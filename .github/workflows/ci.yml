name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHON_FILES: dah_api.py auth_session.py cli_parser.py debtor_data.py debtor_notifications.py debtor_reports.py main.py

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile $PYTHON_FILES

      - name: Validate skill package
        run: python .codex/skills/dah-api-client/scripts/validate_skill.py .codex/skills/dah-api-client

      - name: Test
        run: python -m pytest

      - name: Lint
        run: |
          python -m ruff check .
          python -m flake8
          python -m isort --check-only .
          python -m pylint $PYTHON_FILES tests
          python -m pyright
          python -m vulture $PYTHON_FILES tests --min-confidence 100 --ignore-names cli_env

      - name: Security scan
        run: python -m bandit -q -r .

      - name: Complexity
        run: |
          python -m radon cc -s -a $PYTHON_FILES tests
          bad_complexity="$(python -m radon cc -s -n B $PYTHON_FILES tests)"
          if [ -n "$bad_complexity" ]; then
            echo "$bad_complexity"
            exit 1
          fi
